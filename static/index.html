<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ApexTax Enterprise | Autonomous GST, Direct Tax & SFT Audit Suite</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const HSN_RATES = {
      "8471": 0.18, "8517": 0.18, "6109": 0.05, "1006": 0.00, "9983": 0.18, "8703": 0.28,
    };

    const CLIENT_TENANTS = [
      { id: "apex", name: "Apex Industrial Supplies Ltd", gstin: "36AAACG1234F1Z5", state: "36" },
      { id: "deccan", name: "Deccan Logistics & Infra Pvt Ltd", gstin: "36AABCD5521K1Z2", state: "36" },
      { id: "hitec", name: "Hitec Cloud Technologies LLP", gstin: "36AAFFH9912Q1Z9", state: "36" }
    ];

    const samplePurchaseRegister = [
      { vendor_gstin: "27AAACB2212P1Z0", vendor_name: "Tata Cloud Hosting", doc_number: "TCS/26/1092", doc_date: "2026-09-02", taxable_value: 50000.0, tax_amount: 9000.0 },
      { vendor_gstin: "36AABCR8814D1Z2", vendor_name: "Hyderabad Fiber Infra", doc_number: "HFI-8821", doc_date: "2026-09-05", taxable_value: 20000.0, tax_amount: 3600.0 },
      { vendor_gstin: "29AABCS9912K1Z9", vendor_name: "Bangalore Logistics Corp", doc_number: "BLC/990", doc_date: "2026-09-12", taxable_value: 120000.0, tax_amount: 21600.0 },
      { vendor_gstin: "07AAACZ1122M1Z5", vendor_name: "Delhi Office Supplies", doc_number: "DOS-402", doc_date: "2026-09-15", taxable_value: 15000.0, tax_amount: 2700.0 }
    ];

    const sampleGstr2b = [
      { ctin: "27AAACB2212P1Z0", trade_name: "Tata Cloud Hosting", inum: "TCS/26/1092", dt: "02-09-2026", txval: 50000.0, iamt: 9000.0, camt: 0.0, samt: 0.0 },
      { ctin: "36AABCR8814D1Z2", trade_name: "Hyderabad Fiber Infra", inum: "HFI-8821", dt: "05-09-2026", txval: 20000.0, iamt: 0.0, camt: 1500.0, samt: 1500.0 },
      { ctin: "33AAACL4411Q1Z3", trade_name: "Chennai Software Labs", inum: "CSL/009", dt: "20-09-2026", txval: 35000.0, iamt: 6300.0, camt: 0.0, samt: 0.0 }
    ];

    function App() {
      const [activeTab, setActiveTab] = useState("invoicing");
      const [currentTenant, setCurrentTenant] = useState(CLIENT_TENANTS[0]);
      const [apiKey, setApiKey] = useState("gst_EgKLOK0WOPPoQHjJ7hPJGU334kjDsvnTpVY53iyM8jc");
      const [apiBaseUrl, setApiBaseUrl] = useState(window.location.origin);
      const [statusMessage, setStatusMessage] = useState(null);
      const [loading, setLoading] = useState(false);

      // Invoicing State
      const [docNumber, setDocNumber] = useState(`INV/2026/${Math.floor(1000 + Math.random() * 9000)}`);
      const [docDate, setDocDate] = useState(new Date().toISOString().split("T")[0]);
      const [vehicleNumber, setVehicleNumber] = useState("TS09UB1234");
      const [recipient, setRecipient] = useState({
        legal_name: "Bengaluru Tech Corp Pvt Ltd",
        gstin: "29AABCU9603R1ZX",
        address: "Brigade Gateway, Rajajinagar",
        city: "Bengaluru",
        state_code: "29",
        pincode: 560055,
        email: "billing@techcorp.in"
      });
      const [items, setItems] = useState([
        { item_name: "Enterprise Server Unit", hsn_code: "84713010", quantity: 2, unit_price: 45000 },
        { item_name: "IT Infrastructure Setup", hsn_code: "99831100", quantity: 1, unit_price: 15000 }
      ]);
      const [latestResponse, setLatestResponse] = useState(null);
      const [auditLogs, setAuditLogs] = useState([]);

      // GSTR-2B State
      const [purchaseFile, setPurchaseFile] = useState(null);
      const [portalFile, setPortalFile] = useState(null);
      const [reconResult, setReconResult] = useState(null);
      const [reconLoading, setReconLoading] = useState(false);
      const prInputRef = useRef(null);
      const portalInputRef = useRef(null);

      // DRC-01C State
      const [drcRefNo, setDrcRefNo] = useState("ZD360926001882E");
      const [drcPeriod, setDrcPeriod] = useState("092026");
      const [drcItc2b, setDrcItc2b] = useState("125000");
      const [drcItc3b, setDrcItc3b] = useState("168500");
      const [drcLoading, setDrcLoading] = useState(false);
      const [drcResult, setDrcResult] = useState(null);

      // DRC-01B State
      const [drcbRefNo, setDrcbRefNo] = useState("ZB360926009812A");
      const [drcbPeriod, setDrcbPeriod] = useState("092026");
      const [drcbTax1, setDrcbTax1] = useState("240000");
      const [drcbTax3b, setDrcbTax3b] = useState("180000");
      const [drcbReason, setDrcbReason] = useState("TYPO_SUBSEQUENT_ADJUSTMENT");
      const [drcbLoading, setDrcbLoading] = useState(false);
      const [drcbResult, setDrcbResult] = useState(null);

      // Bank Statement & SFT Analyzer State
      const [bankFileName, setBankFileName] = useState(null);
      const [bankAccountType, setBankAccountType] = useState("Current");
      const [isItrNonFiler, setIsItrNonFiler] = useState(false);
      const [largeCreditThreshold, setLargeCreditThreshold] = useState(500000);
      const [bankAuditSummary, setBankAuditSummary] = useState(null);
      const bankFileInputRef = useRef(null);

      const calculations = useMemo(() => {
        const isInterstate = currentTenant.state !== recipient.state_code;
        let taxableTotal = 0;
        let totalTax = 0;
        items.forEach((itm) => {
          const taxable = (itm.quantity || 0) * (itm.unit_price || 0);
          taxableTotal += taxable;
          const prefix = (itm.hsn_code || "").slice(0, 4);
          const rate = HSN_RATES[prefix] !== undefined ? HSN_RATES[prefix] : 0.18;
          totalTax += taxable * rate;
        });
        const grandTotal = taxableTotal + totalTax;
        return {
          isInterstate,
          taxableTotal,
          cgst: isInterstate ? 0 : totalTax / 2,
          sgst: isInterstate ? 0 : totalTax / 2,
          igst: isInterstate ? totalTax : 0,
          grandTotal,
          ewayMandatory: grandTotal >= 50000
        };
      }, [currentTenant.state, recipient.state_code, items]);

      const fetchAuditTrail = async () => {
        try {
          const res = await fetch(`${apiBaseUrl}/api/v1/invoices/audit-trail`, {
            headers: { "x-api-key": apiKey }
          });
          if (res.ok) {
            const data = await res.json();
            setAuditLogs(data.audit_events || []);
          }
        } catch (e) {
          console.error(e);
        }
      };

      useEffect(() => {
        fetchAuditTrail();
      }, []);

      const handleSubmitInvoice = async (e) => {
        e.preventDefault();
        setLoading(true);
        setStatusMessage(null);
        const payload = {
          doc_number: docNumber,
          doc_date: docDate,
          supplier: {
            legal_name: currentTenant.name,
            gstin: currentTenant.gstin,
            address: "Plot 42, Hitec City",
            city: "Hyderabad",
            state_code: currentTenant.state,
            pincode: 500081
          },
          recipient: { ...recipient, pincode: Number(recipient.pincode) },
          items: items.map(i => ({ ...i, quantity: Number(i.quantity), unit_price: Number(i.unit_price) })),
          vehicle_number: vehicleNumber || null
        };
        try {
          const res = await fetch(`${apiBaseUrl}/api/v1/invoices/process`, {
            method: "POST",
            headers: { "Content-Type": "application/json", "x-api-key": apiKey.trim() },
            body: JSON.stringify(payload)
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.detail || "Failed to process invoice");
          setLatestResponse(data);
          setStatusMessage({ type: "success", text: `Invoice ${docNumber} sealed & IRN minted!` });
          fetchAuditTrail();
          setDocNumber(`INV/2026/${Math.floor(1000 + Math.random() * 9000)}`);
        } catch (err) {
          setStatusMessage({ type: "error", text: err.message });
        } finally {
          setLoading(false);
        }
      };

      const handleUploadAndReconcile = async () => {
        if (!purchaseFile || !portalFile) {
          setStatusMessage({ type: "error", text: "Select BOTH the Purchase Register and GSTR-2B JSON file." });
          return;
        }
        setReconLoading(true);
        setStatusMessage(null);
        const formData = new FormData();
        formData.append("purchase_file", purchaseFile);
        formData.append("portal_file", portalFile);
        try {
          const res = await fetch(`${apiBaseUrl}/api/v1/compliance/reconcile-files`, {
            method: "POST",
            headers: { "x-api-key": apiKey.trim() },
            body: formData
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.detail || "Reconciliation failed");
          setReconResult(data);
          setStatusMessage({ type: "success", text: "Live Section 16(2)(aa) audit completed!" });
          fetchAuditTrail();
        } catch (err) {
          setStatusMessage({ type: "error", text: err.message });
        } finally {
          setReconLoading(false);
        }
      };

      const handleRunSimulatedRecon = async () => {
        setReconLoading(true);
        try {
          const res = await fetch(`${apiBaseUrl}/api/v1/compliance/reconcile-2b`, {
            method: "POST",
            headers: { "Content-Type": "application/json", "x-api-key": apiKey.trim() },
            body: JSON.stringify({ purchase_register: samplePurchaseRegister, gstr2b_records: sampleGstr2b })
          });
          const data = await res.json();
          setReconResult({ ...data, _raw_purchase_register: samplePurchaseRegister, _raw_gstr2b_records: sampleGstr2b });
          setStatusMessage({ type: "success", text: "Simulated GSTR-2B audit completed!" });
        } catch (err) {
          setStatusMessage({ type: "error", text: err.message });
        } finally {
          setReconLoading(false);
        }
      };

      const handleResolveDRC01C = async (e) => {
        e.preventDefault();
        setDrcLoading(true);
        const formData = new FormData();
        formData.append("ref_no", drcRefNo);
        formData.append("period", drcPeriod);
        formData.append("itc_2b", Number(drcItc2b));
        formData.append("itc_3b", Number(drcItc3b));
        try {
          const res = await fetch(`${apiBaseUrl}/api/v1/compliance/drc01c/resolve`, { method: "POST", body: formData });
          const data = await res.json();
          setDrcResult(data);
          setStatusMessage({ type: "success", text: "DRC-01C statutory Part-B reply generated!" });
        } catch (err) {
          setStatusMessage({ type: "error", text: err.message });
        } finally {
          setDrcLoading(false);
        }
      };

      const handleResolveDRC01B = async (e) => {
        e.preventDefault();
        setDrcbLoading(true);
        const formData = new FormData();
        formData.append("ref_no", drcbRefNo);
        formData.append("period", drcbPeriod);
        formData.append("tax_1", Number(drcbTax1));
        formData.append("tax_3b", Number(drcbTax3b));
        formData.append("reason_code", drcbReason);
        try {
          const res = await fetch(`${apiBaseUrl}/api/v1/compliance/drc01b/resolve`, { method: "POST", body: formData });
          const data = await res.json();
          setDrcbResult(data);
          setStatusMessage({ type: "success", text: "DRC-01B outward defense generated!" });
        } catch (err) {
          setStatusMessage({ type: "error", text: err.message });
        } finally {
          setDrcbLoading(false);
        }
      };

      // Client-Side Bank Statement & SFT Audit Engine
      const handleParseBankStatement = (file) => {
        if (!file) return;
        setBankFileName(file.name);
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, { type: "array" });
            const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
            const rows = XLSX.utils.sheet_to_json(firstSheet, { header: 1, defval: "" });

            let headerIdx = -1;
            let dateCol = -1, narrCol = -1, debitCol = -1, creditCol = -1, balCol = -1;

            for (let i = 0; i < Math.min(rows.length, 25); i++) {
              const r = rows[i].map(c => String(c).toLowerCase().trim());
              dateCol = r.findIndex(c => c.includes("date") || c.includes("txn date") || c.includes("value dt"));
              narrCol = r.findIndex(c => c.includes("narration") || c.includes("particular") || c.includes("description"));
              debitCol = r.findIndex(c => c.includes("debit") || c.includes("withdrawal") || c.includes("dr"));
              creditCol = r.findIndex(c => c.includes("credit") || c.includes("deposit") || c.includes("cr"));
              balCol = r.findIndex(c => c.includes("balance") || c.includes("closing"));
              if (dateCol !== -1 && (debitCol !== -1 || creditCol !== -1)) {
                headerIdx = i;
                break;
              }
            }

            let totalCredits = 0, totalDebits = 0;
            let cashDeposits = 0, cashWithdrawals = 0;
            let singleDayHighCash = [];
            let largeCredits = [];
            let inwardBounces = 0, outwardBounces = 0;
            const dateCashMap = {};

            const parseVal = (v) => {
              if (typeof v === "number") return v;
              if (!v) return 0;
              const clean = String(v).replace(/[^0-9.-]+/g, "");
              const n = parseFloat(clean);
              return isNaN(n) ? 0 : n;
            };

            const dataRows = headerIdx !== -1 ? rows.slice(headerIdx + 1) : rows;

            dataRows.forEach(r => {
              const rawNarr = narrCol !== -1 ? String(r[narrCol] || "") : "";
              const rawDate = dateCol !== -1 ? String(r[dateCol] || "") : "Unknown";
              const debit = debitCol !== -1 ? parseVal(r[debitCol]) : 0;
              const credit = creditCol !== -1 ? parseVal(r[creditCol]) : 0;

              totalDebits += debit;
              totalCredits += credit;

              const narrUpper = rawNarr.toUpperCase();
              const isCash = narrUpper.includes("CASH") || narrUpper.includes("CWDR") || narrUpper.includes("CDTR") || narrUpper.includes("BY CASH") || narrUpper.includes("SELF");

              if (credit > 0 && isCash) {
                cashDeposits += credit;
                dateCashMap[rawDate] = (dateCashMap[rawDate] || 0) + credit;
              }

              if (debit > 0 && isCash) {
                cashWithdrawals += debit;
              }

              if (credit >= Number(largeCreditThreshold)) {
                largeCredits.push({ date: rawDate, narration: rawNarr, amount: credit });
              }

              if (narrUpper.includes("BOUNCE") || narrUpper.includes("RETURN") || narrUpper.includes("RET") || narrUpper.includes("ECS RET") || narrUpper.includes("INSUFFICIENT")) {
                if (debit > 0) outwardBounces++;
                if (credit > 0) inwardBounces++;
              }
            });

            Object.entries(dateCashMap).forEach(([dt, amt]) => {
              if (amt >= 200000) {
                singleDayHighCash.push({ date: dt, amount: amt });
              }
            });

            // Statutory Audit Verification
            const sftThreshold = bankAccountType === "Current" ? 5000000 : 1000000;
            const sftBreached = cashDeposits >= sftThreshold;
            const sec269stBreached = singleDayHighCash.length > 0;

            const tds194nThreshold = isItrNonFiler ? 2000000 : 10000000;
            const sec194nBreached = cashWithdrawals >= tds194nThreshold;

            setBankAuditSummary({
              totalCredits,
              totalDebits,
              cashDeposits,
              cashWithdrawals,
              sftThreshold,
              sftBreached,
              sec269stBreached,
              singleDayHighCash,
              sec194nBreached,
              tds194nThreshold,
              largeCredits,
              inwardBounces,
              outwardBounces,
              rowCount: dataRows.length
            });
            setStatusMessage({ type: "success", text: "Bank Statement Analyzed Locally! Statutory flags updated." });
          } catch (err) {
            console.error(err);
            setStatusMessage({ type: "error", text: "Failed to parse bank file format." });
          }
        };
        reader.readAsArrayBuffer(file);
      };

      const handleSimulateBankAudit = () => {
        setBankFileName("HDFC_Corporate_Statement_Sept2026.xlsx");
        setBankAuditSummary({
          totalCredits: 18450000,
          totalDebits: 16210000,
          cashDeposits: 5400000,
          cashWithdrawals: 2850000,
          sftThreshold: 5000000,
          sftBreached: true,
          sec269stBreached: true,
          singleDayHighCash: [
            { date: "14-09-2026", amount: 245000 },
            { date: "22-09-2026", amount: 310000 }
          ],
          sec194nBreached: isItrNonFiler,
          tds194nThreshold: isItrNonFiler ? 2000000 : 10000000,
          largeCredits: [
            { date: "05-09-2026", narration: "RTGS CR-TEX TRADERS-INVOICE REF", amount: 2200000 },
            { date: "18-09-2026", narration: "NEFT CR-UNIDENTIFIED REMITTANCE", amount: 1450000 }
          ],
          inwardBounces: 2,
          outwardBounces: 0,
          rowCount: 142
        });
        setStatusMessage({ type: "success", text: "Bank Statement Audit Demo Loaded!" });
      };

      return (
        <div className="min-h-screen flex flex-col">
          <header className="border-b border-slate-800 bg-slate-900/60 backdrop-blur px-6 py-3.5 flex items-center justify-between sticky top-0 z-30">
            <div className="flex items-center gap-3">
              <div className="w-9 h-9 rounded-lg bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center font-bold text-lg text-white shadow-lg shadow-cyan-500/20">
                A
              </div>
              <div>
                <h1 className="font-bold text-base leading-none tracking-tight text-white">ApexTax Enterprise</h1>
                <p className="text-[11px] text-slate-400 mt-1">Autonomous GST, Direct Tax &amp; SFT Audit Platform</p>
              </div>
            </div>

            {/* TAB SELECTOR */}
            <div className="flex bg-slate-950 p-1 rounded-lg border border-slate-800 gap-1">
              <button
                onClick={() => setActiveTab("invoicing")}
                className={`px-3 py-1.5 text-xs font-semibold rounded-md transition ${
                  activeTab === 'invoicing' ? 'bg-cyan-600 text-white shadow' : 'text-slate-400 hover:text-white'
                }`}
              >
                Invoicing &amp; IRN
              </button>
              <button
                onClick={() => setActiveTab("reconciliation")}
                className={`px-3 py-1.5 text-xs font-semibold rounded-md transition flex items-center gap-1.5 ${
                  activeTab === 'reconciliation' ? 'bg-cyan-600 text-white shadow' : 'text-slate-400 hover:text-white'
                }`}
              >
                <span>2B Matcher</span>
                <span className="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
              </button>
              <button
                onClick={() => setActiveTab("drc01c")}
                className={`px-3 py-1.5 text-xs font-semibold rounded-md transition flex items-center gap-1.5 ${
                  activeTab === 'drc01c' ? 'bg-emerald-600 text-white shadow' : 'text-slate-400 hover:text-white'
                }`}
              >
                <span>DRC-01C (88D)</span>
                <span className="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
              </button>
              <button
                onClick={() => setActiveTab("drc01b")}
                className={`px-3 py-1.5 text-xs font-semibold rounded-md transition flex items-center gap-1.5 ${
                  activeTab === 'drc01b' ? 'bg-purple-600 text-white shadow' : 'text-slate-400 hover:text-white'
                }`}
              >
                <span>DRC-01B (88C)</span>
                <span className="w-1.5 h-1.5 rounded-full bg-amber-400"></span>
              </button>
              <button
                onClick={() => setActiveTab("bank_audit")}
                className={`px-3 py-1.5 text-xs font-semibold rounded-md transition flex items-center gap-1.5 ${
                  activeTab === 'bank_audit' ? 'bg-amber-600 text-white shadow' : 'text-slate-400 hover:text-white'
                }`}
              >
                <span>🏦 Bank &amp; SFT Audit</span>
                <span className="w-1.5 h-1.5 rounded-full bg-cyan-400"></span>
              </button>
            </div>

            {/* MULTI-TENANT WORKSPACE SELECTOR */}
            <div className="flex items-center gap-3">
              <div className="flex items-center gap-1.5 bg-slate-950 border border-slate-800 rounded px-2.5 py-1">
                <span className="text-[10px] text-slate-400 uppercase font-bold">Client:</span>
                <select
                  value={currentTenant.id}
                  onChange={(e) => {
                    const sel = CLIENT_TENANTS.find(t => t.id === e.target.value);
                    if (sel) setCurrentTenant(sel);
                  }}
                  className="bg-transparent text-xs text-cyan-300 font-semibold focus:outline-none cursor-pointer"
                >
                  {CLIENT_TENANTS.map(t => (
                    <option key={t.id} value={t.id} className="bg-slate-900 text-white">
                      {t.name.slice(0, 22)}...
                    </option>
                  ))}
                </select>
              </div>
              <span className="text-xs font-mono text-emerald-400 bg-emerald-950/60 border border-emerald-800/80 px-2 py-1 rounded">
                Authorized
              </span>
            </div>
          </header>

          {statusMessage && (
            <div className={`px-6 py-2.5 text-xs flex items-center justify-between ${
              statusMessage.type === 'success' ? 'bg-emerald-950/80 text-emerald-300 border-b border-emerald-800' : 'bg-rose-950/80 text-rose-300 border-b border-rose-800'
            }`}>
              <span>{statusMessage.text}</span>
              <button onClick={() => setStatusMessage(null)} className="text-[10px] font-bold uppercase tracking-wider opacity-70 hover:opacity-100">Dismiss</button>
            </div>
          )}

          {/* TAB 1: INVOICING */}
          {activeTab === "invoicing" && (
            <main className="flex-1 max-w-7xl w-full mx-auto p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
              <div className="lg:col-span-7 space-y-6">
                <form onSubmit={handleSubmitInvoice} className="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-xl space-y-6">
                  <div className="flex items-center justify-between border-b border-slate-800 pb-4">
                    <div>
                      <h2 className="text-base font-semibold text-white">Create Statutory Invoice</h2>
                      <p className="text-xs text-slate-400">NIC INV-01 compliant schema with live interstate detection</p>
                    </div>
                    <span className="text-xs font-medium px-2.5 py-1 rounded bg-slate-800 text-slate-300 font-mono">
                      {docNumber}
                    </span>
                  </div>

                  <div className="grid grid-cols-3 gap-4">
                    <div>
                      <label className="block text-xs font-medium text-slate-400 mb-1">Invoice Number</label>
                      <input

                        <span className="text-xl font-bold font-mono text-cyan-400">Rs. {bankAuditSummary.totalCredits.toLocaleString('en-IN', { minimumFractionDigits: 2 })}</span>
                      </div>
                      <div className="bg-slate-950 border border-slate-800 p-4 rounded-xl">
                        <span className="text-xs text-slate-400 block">Total Debits</span>
                        <span className="text-xl font-bold font-mono text-slate-200">Rs. {bankAuditSummary.totalDebits.toLocaleString('en-IN', { minimumFractionDigits: 2 })}</span>
                      </div>
                      <div className="bg-slate-950 border border-slate-800 p-4 rounded-xl">
                        <span className="text-xs text-slate-400 block">Aggregate Cash Deposits</span>
                        <span className="text-xl font-bold font-mono text-amber-400">Rs. {bankAuditSummary.cashDeposits.toLocaleString('en-IN')}</span>
                      </div>
                      <div className="bg-slate-950 border border-slate-800 p-4 rounded-xl">
                        <span className="text-xs text-slate-400 block">Aggregate Cash Withdrawals</span>
                        <span className="text-xl font-bold font-mono text-rose-400">Rs. {bankAuditSummary.cashWithdrawals.toLocaleString('en-IN')}</span>
                      </div>
                    </div>

                    {/* Statutory Compliance Findings */}
                    <div className="grid grid-cols-2 gap-4">
                      {/* SFT Cash Rule */}
                      <div className={`p-4 rounded-xl border ${bankAuditSummary.sftBreached ? 'bg-rose-950/30 border-rose-800/60' : 'bg-emerald-950/30 border-emerald-800/60'}`}>
                        <div className="flex justify-between items-center mb-2">
                          <span className="text-xs font-bold text-white uppercase">SFT Reporting Threshold (Rule 114E)</span>
                          <span className={`text-[10px] font-bold px-2 py-0.5 rounded ${bankAuditSummary.sftBreached ? 'bg-rose-900 text-rose-200' : 'bg-emerald-900 text-emerald-200'}`}>
                            {bankAuditSummary.sftBreached ? 'SFT REPORTABLE' : 'CLEAR'}
                          </span>
                        </div>
                        <p className="text-xs text-slate-300">
                          {bankAuditSummary.sftBreached
                            ? `Total cash deposits (₹${bankAuditSummary.cashDeposits.toLocaleString('en-IN')}) exceed the ₹${(bankAuditSummary.sftThreshold/100000)} Lakh annual limit. This bank account is subject to automatic AIR/SFT submission to the Income Tax Department.`
                            : `Cash deposits are within the statutory ₹${(bankAuditSummary.sftThreshold/100000)} Lakh threshold.`}
                        </p>
                      </div>

                      {/* Section 269ST Rule */}
                      <div className={`p-4 rounded-xl border ${bankAuditSummary.sec269stBreached ? 'bg-rose-950/30 border-rose-800/60' : 'bg-emerald-950/30 border-emerald-800/60'}`}>
                        <div className="flex justify-between items-center mb-2">
                          <span className="text-xs font-bold text-white uppercase">Section 269ST Single-Day Cash Receipt</span>
                          <span className={`text-[10px] font-bold px-2 py-0.5 rounded ${bankAuditSummary.sec269stBreached ? 'bg-rose-900 text-rose-200' : 'bg-emerald-900 text-emerald-200'}`}>
                            {bankAuditSummary.sec269stBreached ? 'PENALTY RISK (SEC 271DA)' : 'CLEAR'}
                          </span>
                        </div>
                        <p className="text-xs text-slate-300">
                          {bankAuditSummary.sec269stBreached
                            ? `${bankAuditSummary.singleDayHighCash.length} instance(s) detected with cash receipts ≥ ₹2,00,000 on a single day. Section 271DA levies a 100% penalty on the receiver.`
                            : "No single-day cash transactions exceeded the ₹2 Lakh threshold."}
                        </p>
                      </div>

                      {/* Section 194N Cash Withdrawal TDS */}
                      <div className={`p-4 rounded-xl border ${bankAuditSummary.sec194nBreached ? 'bg-amber-950/30 border-amber-800/60' : 'bg-emerald-950/30 border-emerald-800/60'}`}>
                        <div className="flex justify-between items-center mb-2">
                          <span className="text-xs font-bold text-white uppercase">Section 194N Cash Withdrawal TDS</span>
                          <span className={`text-[10px] font-bold px-2 py-0.5 rounded ${bankAuditSummary.sec194nBreached ? 'bg-amber-900 text-amber-200' : 'bg-emerald-900 text-emerald-200'}`}>
                            {bankAuditSummary.sec194nBreached ? 'TDS APPLICABLE' : 'CLEAR'}
                          </span>
                        </div>
                        <p className="text-xs text-slate-300">
                          {bankAuditSummary.sec194nBreached
                            ? `Withdrawals (₹${bankAuditSummary.cashWithdrawals.toLocaleString('en-IN')}) exceed the ₹${(bankAuditSummary.tds194nThreshold/100000)} Lakh threshold. Bank must deduct 2% to 5% TDS.`
                            : `Cash withdrawals are within safe non-TDS limits.`}
                        </p>
                      </div>

                      {/* Cheque & Inward Bounces */}
                      <div className="p-4 rounded-xl border border-slate-800 bg-slate-950/50">
                        <div className="flex justify-between items-center mb-2">
                          <span className="text-xs font-bold text-white uppercase">Banking Health &amp; CMA Metrics</span>
                          <span className="text-[10px] font-mono text-cyan-300 bg-slate-900 px-2 py-0.5 rounded">BANK RATING</span>
                        </div>
                        <div className="flex gap-4 text-xs font-mono">
                          <div>Inward Bounces: <span className="font-bold text-amber-400">{bankAuditSummary.inwardBounces}</span></div>
                          <div>Outward Bounces: <span className="font-bold text-rose-400">{bankAuditSummary.outwardBounces}</span></div>
                        </div>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            </main>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
